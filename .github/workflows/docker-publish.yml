name: Build and Push Docker Images

# Build strategy mirrors onixldlc/elkstack (buildx + ghcr + metadata-action + gha cache).
# Versioning mirrors onixldlc/mcp-linux-go (tag -> ref name minus "v", otherwise git describe).
#
# Every push and PR builds the images (compile check). Only a pushed tag v* logs in and
# publishes. Debian is the only variant built here; the Dockerfile.alpine files are
# reference material and are deliberately not built.
#
# Images:
#   regamedll   - compiled cs.so + dist + cssdk, context = repo root
#   hlbase      - FROM scratch, carries only fetch-content.sh, context = docker/HLbase
#   hlds-server - runner: rehlds + regamedll + the fetch script, context = docker/runner
#
# No image published here contains Valve game content. The runner downloads it with
# steamcmd into a volume on first start, so each deployment fetches its own copy.
#
# The runner resolves its inputs with `FROM`/`COPY --from` on image references, which buildx
# pulls from a registry. On a branch or PR run nothing is pushed, so the freshly built
# regamedll/hlbase are not fetchable and the runner cannot be assembled. It therefore runs on
# tag pushes (and manual dispatch) only.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_image:
        description: 'Engine image for the runner (default ghcr.io/<owner>/rehlds:latest)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # appversion.sh derives the build number from `git rev-list --count`; a shallow
          # clone makes every build "1". Full history is mandatory, not an optimisation.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            PUBLISH=true
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
            PUBLISH=false
          fi
          # Keep the string usable as a docker tag.
          VERSION="$(printf %s "${VERSION}" | tr -c 'A-Za-z0-9._-' '-')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (publish=${PUBLISH})"

  build-and-push:
    runs-on: ubuntu-latest
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: regamedll
            context: .
            dockerfile: ./docker/ReGameDLL/Dockerfile
          - image: hlbase
            context: ./docker/HLbase
            dockerfile: ./docker/HLbase/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # regamedll/extra/cssdk is a submodule; the build asserts extdll.h is present.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.determine-version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ needs.determine-version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ needs.determine-version.outputs.publish != 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify artifacts
        if: needs.determine-version.outputs.publish != 'true' && matrix.image == 'regamedll'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ github.repository_owner }}/regamedll:latest verify

      - name: Check fetch script is present
        if: needs.determine-version.outputs.publish != 'true' && matrix.image == 'hlbase'
        run: |
          # hlbase is FROM scratch: there is no shell to run, so inspect the image
          # filesystem instead. docker export streams a container's rootfs as a tar.
          cid=$(docker create ${{ env.REGISTRY }}/${{ github.repository_owner }}/hlbase:latest /nonexistent)
          docker export "$cid" | tar -t | grep -qx 'hlbase/fetch-content.sh'
          docker rm "$cid" >/dev/null
          echo "fetch-content.sh present"

      - name: Summary
        run: |
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.determine-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Published:** \`${{ needs.determine-version.outputs.publish }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ needs.determine-version.outputs.version }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY

  runner:
    name: Build and push runner
    runs-on: ubuntu-latest
    needs: [determine-version, build-and-push]
    if: needs.determine-version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve input images
        id: inputs
        run: |
          OWNER="${{ github.repository_owner }}"
          ENGINE="${{ github.event.inputs.engine_image }}"
          if [[ -z "${ENGINE}" ]]; then
            # The engine lives in the ReHLDS repo and is versioned independently, so the
            # runner tracks its floating :latest tag rather than this repo's version.
            ENGINE="${{ env.REGISTRY }}/${OWNER}/rehlds:latest"
          fi
          VER="${{ needs.determine-version.outputs.version }}"
          if [[ "${{ needs.determine-version.outputs.publish }}" != "true" ]]; then
            VER="latest"
          fi
          echo "engine=${ENGINE}" >> "$GITHUB_OUTPUT"
          echo "hlbase=${{ env.REGISTRY }}/${OWNER}/hlbase:${VER}" >> "$GITHUB_OUTPUT"
          echo "gamedll=${{ env.REGISTRY }}/${OWNER}/regamedll:${VER}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hlds-server
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker/runner
          file: ./docker/runner/Dockerfile
          push: ${{ needs.determine-version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ needs.determine-version.outputs.publish != 'true' }}
          build-args: |
            HLBASE_IMAGE=${{ steps.inputs.outputs.hlbase }}
            ENGINE_IMAGE=${{ steps.inputs.outputs.engine }}
            GAMEDLL_IMAGE=${{ steps.inputs.outputs.gamedll }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check server image contents
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/hlds-server:latest"
          # A real boot would pull ~700 MB of game content from Steam on every
          # release, so CI asserts the pieces instead: the fetcher, the 32-bit
          # engine and the game dll. End-to-end boot is covered by the compose file.
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            test -x /usr/local/bin/fetch-content.sh
            test -x /usr/local/bin/server-entrypoint.sh
            test -f /opt/dist/engine/engine_i486.so
            test -f /opt/dist/cstrike/dlls/cs.so
            file /opt/dist/engine/engine_i486.so | grep -q "Intel 80386"
            file /opt/dist/cstrike/dlls/cs.so    | grep -q "Intel 80386"
            echo "fetcher, engine and game dll present, both 32-bit"
          '

      - name: Summary
        run: |
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/hlds-server\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.determine-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Engine:** \`${{ steps.inputs.outputs.engine }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Base:** \`${{ steps.inputs.outputs.hlbase }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Game dll:** \`${{ steps.inputs.outputs.gamedll }}\`" >> $GITHUB_STEP_SUMMARY
